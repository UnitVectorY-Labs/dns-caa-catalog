<!DOCTYPE html>
<html lang="en">
{{ $PageName := "DNS CAA Catalog" }}
{{template "header" $PageName}}
<body>
    <a class="skip-link" href="#content">Skip to content</a>
    <header>
        <button type="button" class="nav-toggle" id="navToggle" aria-controls="leftPanel" aria-expanded="false" aria-label="Open domain navigation"><svg class="icon" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"> <path d="M4 6l16 0" /> <path d="M4 12l16 0" /> <path d="M4 18l16 0" /> </svg></button>
        <a href="/index.html" hx-get="/snippets/home.html" hx-target="#content" hx-push-url="/index.html"><h1>DNS CAA Catalog</h1></a>
        <button type="button" id="theme-toggle" data-uvy-theme-toggle class="uvy-theme-toggle" aria-label="Switch to dark mode" hidden><span class="uvy-theme-dark-icon"><svg class="icon" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"> <path d="M12 3c.132 0 .263 0 .393 0a7.5 7.5 0 0 0 7.92 12.446a9 9 0 1 1 -8.313 -12.454l0 .008" /> </svg></span><span class="uvy-theme-light-icon"><svg class="icon" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"> <path d="M8 12a4 4 0 1 0 8 0a4 4 0 1 0 -8 0" /> <path d="M3 12h1m8 -9v1m8 8h1m-9 8v1m-6.4 -15.4l.7 .7m12.1 -.7l-.7 .7m0 11.4l.7 .7m-12.1 -.7l-.7 .7" /> </svg></span></button>
    </header>
    <noscript><style>.nav-toggle{visibility:hidden}</style><p class="no-script-nav"><a href="/snippets/nav.html">Browse all domains</a> · Search and record filters require JavaScript.</p></noscript>
    <div class="nav-overlay" id="navOverlay" aria-hidden="true"></div>
    <div class="container">
        <nav aria-label="Domains" class="left-panel" id="leftPanel" hx-get="/snippets/nav.html" hx-trigger="load" hx-swap="innerHTML">

        </nav>
        <main class="right-panel" id="content" tabindex="-1">
            {{.Content}}
        </main>
    </div>
    {{template "footer" .}}

</body>
</html>
