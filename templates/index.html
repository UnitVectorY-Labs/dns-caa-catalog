<!DOCTYPE html>
<html lang="en">
{{ $PageName := "DNS CAA Catalog" }}
{{template "header" $PageName}}
<body>
    <a class="skip-link" href="#content">Skip to content</a>
    <header>
        <button type="button" class="nav-toggle" id="navToggle" aria-controls="leftPanel" aria-expanded="false" aria-label="Open domain navigation">{{template "icon-menu-2"}}</button>
        <a href="/index.html" hx-get="/snippets/home.html" hx-target="#content" hx-push-url="/index.html"><h1>DNS CAA Catalog</h1></a>
        <button type="button" id="theme-toggle" data-uvy-theme-toggle class="uvy-theme-toggle" aria-label="Switch to dark mode" hidden><span class="uvy-theme-dark-icon">{{template "icon-moon"}}</span><span class="uvy-theme-light-icon">{{template "icon-sun"}}</span></button>
    </header>
    <noscript><style>.nav-toggle{visibility:hidden}</style><p class="no-script-nav"><a href="/snippets/nav.html">Browse all domains</a> · Search and record filters require JavaScript.</p></noscript>
    <div class="nav-overlay" id="navOverlay" aria-hidden="true"></div>
    <div class="container">
        <nav aria-label="Domains" class="left-panel" id="leftPanel" hx-get="/snippets/nav.html" hx-trigger="load" hx-swap="innerHTML">

        </nav>
        <main class="right-panel" id="content" tabindex="-1">
            {{.Content}}
        </main>
    </div>
    {{template "footer" .}}

</body>
</html>
