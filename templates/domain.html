<!DOCTYPE html>
<html lang="en">
{{ $PageName := printf "%s — DNS CAA Catalog" .DomainResult.Domain }}
{{template "header" $PageName}}
<body>
  {{template "site-header" .}}
  <main class="page layout" id="main">
    {{template "sidebar" .}}
    <div class="workspace" id="content">
      {{.Content}}
    </div>
  </main>
  <button id="menu-backdrop" class="menu-backdrop" type="button" aria-label="Close navigation" tabindex="-1" hidden></button>
  {{template "footer" .}}
</body>
</html>
